  <rect x="84.5" y="16" width="11" height="54" rx="5.5"/>
  <rect x="104.5" y="16" width="11" height="54" rx="5.5"/>
  <rect x="123.5" y="16" width="11" height="54" rx="5.5"/>

  <!-- South -->
  <rect x="65.5" y="130" width="11" height="54" rx="5.5"/>
  <rect x="84.5" y="130" width="11" height="54" rx="5.5"/>
  <rect x="104.5" y="130" width="11" height="54" rx="5.5"/>
  <rect x="123.5" y="130" width="11" height="54" rx="5.5"/>

  <!-- West -->
  <rect x="16" y="65.5" width="54" height="11" rx="5.5"/>
  <rect x="16" y="84.5" width="54" height="11" rx="5.5"/>
  <rect x="16" y="104.5" width="54" height="11" rx="5.5"/>
  <rect x="16" y="123.5" width="54" height="11" rx="5.5"/>

  <!-- East -->
  <rect x="130" y="65.5" width="54" height="11" rx="5.5"/>
  <rect x="130" y="84.5" width="54" height="11" rx="5.5"/>
  <rect x="130" y="104.5" width="54" height="11" rx="5.5"/>
