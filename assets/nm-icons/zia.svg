  <rect x="45.05" y="8" width="4.1" height="28"/>
  <rect x="50.85" y="8" width="4.1" height="28"/>
  <rect x="56.65" y="8" width="4.1" height="28"/>
  <!-- South -->
  <rect x="39.25" y="64" width="4.1" height="28"/>
  <rect x="45.05" y="64" width="4.1" height="28"/>
  <rect x="50.85" y="64" width="4.1" height="28"/>
  <rect x="56.65" y="64" width="4.1" height="28"/>
  <!-- West -->
  <rect x="8" y="39.25" width="28" height="4.1"/>
  <rect x="8" y="45.05" width="28" height="4.1"/>
  <rect x="8" y="50.85" width="28" height="4.1"/>
  <rect x="8" y="56.65" width="28" height="4.1"/>
  <!-- East -->
  <rect x="64" y="39.25" width="28" height="4.1"/>
  <rect x="64" y="45.05" width="28" height="4.1"/>
  <rect x="64" y="50.85" width="28" height="4.1"/>
  <rect x="64" y="56.65" width="28" height="4.1"/>
</svg>
